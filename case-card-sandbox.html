<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Case Card Sandbox · RTI</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #FAF6EE;
    --ink: #171717;
    --ink-soft: #5A5A55;
    --ink-mute: #9A9489;
    --accent: #1F4D3E;
    --green-soft: rgba(31, 77, 62, 0.65);
    --line: rgba(23, 23, 23, 0.10);
    --display: "Fraunces", Georgia, serif;
    --body: "General Sans", -apple-system, system-ui, sans-serif;
    --ease: cubic-bezier(0.2, 0.65, 0.3, 1);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* Section label */
  .section-head {
    text-align: center;
    padding: 80px 24px 40px;
  }
  .section-head h2 {
    font-family: var(--display);
    font-weight: 350;
    font-size: clamp(32px, 4vw, 48px);
    line-height: 1.1;
    letter-spacing: -0.018em;
    color: var(--ink);
    margin: 0;
    font-variation-settings: "opsz" 60;
  }

  /* Case card — reference: tags row, then 2-col title+description, then visual block */
  .case-card {
    max-width: 1180px;
    margin: 0 auto 80px;
    background: rgba(31, 77, 62, 0.05);
    border-radius: 28px;
    padding: 36px 40px 40px;
    position: relative;
    overflow: hidden;
  }

  /* Tag row at the very top */
  .case-tags {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 32px;
  }
  .case-tags span {
    font-family: var(--body);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.10em;
    color: var(--ink-soft);
  }
  .case-tags .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--green-soft);
    letter-spacing: 0;
  }

  /* Header row: title left, divider, description right */
  .case-header {
    display: grid;
    grid-template-columns: minmax(280px, 1fr) 1px minmax(280px, 1.2fr);
    gap: 40px;
    align-items: start;
    margin-bottom: 40px;
  }
  .case-title {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(22px, 2vw, 28px);
    line-height: 1.22;
    letter-spacing: -0.014em;
    color: var(--ink);
    margin: 0;
    font-variation-settings: "opsz" 48;
  }
  .case-divider {
    width: 1px;
    align-self: stretch;
    background: var(--line);
    min-height: 64px;
  }
  .case-description {
    font-family: var(--body);
    font-size: 15.5px;
    font-weight: 400;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0;
    padding-top: 4px;
  }

  /* Visual block at bottom */
  .case-visual {
    background: linear-gradient(180deg, rgba(31, 77, 62, 0.05) 0%, rgba(31, 77, 62, 0.02) 100%);
    border-radius: 20px;
    padding: 32px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .case-visual img {
    max-width: 100%;
    height: auto;
    display: block;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(31, 77, 62, 0.10),
                0 24px 48px rgba(31, 77, 62, 0.08);
  }

  /* Page nav so the sandbox feels in-context */
  nav.nav {
    display: flex;
    align-items: center;
    padding: 28px 40px;
    border-bottom: 1px solid var(--line);
  }
  .wordmark {
    font-family: var(--body);
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
  }
  .sandbox-label {
    margin-left: auto;
    font-family: var(--body);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }

  /* Responsive — collapse the 2-col header to a stack on narrow screens */
  @media (max-width: 720px) {
    .case-card { padding: 28px 22px 30px; border-radius: 20px; }
    .case-header {
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .case-divider {
      width: 100%;
      height: 1px;
      min-height: 0;
    }
    .section-head { padding: 56px 24px 32px; }
  }
</style>
</head>
<body>

  <nav class="nav">
    <a href="/" class="wordmark">Dinesh Baller</a>
    <span class="sandbox-label">Sandbox · Case Card v2</span>
  </nav>

  <div class="section-head">
    <h2>Featured Work</h2>
  </div>

  <article class="case-card">

    <div class="case-tags">
      <span>Operations Platform</span>
      <span class="dot" aria-hidden="true"></span>
      <span>Mortgage Servicing</span>
    </div>

    <div class="case-header">
      <h3 class="case-title">
        Real-Time Inquiry Portal · Onity Group
      </h3>
      <div class="case-divider" aria-hidden="true"></div>
      <p class="case-description">
        I built a real-time portal that replaces email threads with live inquiry visibility, cutting case resolution by 62% and saving managers 6 hours a week.
      </p>
    </div>

    <div class="case-visual">
      <img src="./images/rti-final-overview.png" alt="Inquiry Dashboard with an expanded case row showing the real-time progress tracker, Overview tab with case details and timeline, and the live filterable case table beneath" />
    </div>

  </article>

</body>
</html>
