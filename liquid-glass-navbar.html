<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Navbar — Dinesh</title>
  <style>
    /* ─────────────────────────────────────────
       DESIGN TOKENS — change these in one place
       ───────────────────────────────────────── */
    :root {
      /* Glass material */
      --glass-bg:        rgba(255, 255, 255, 0.42);
      --glass-border:    rgba(255, 255, 255, 0.45);
      --glass-hl-top:    rgba(255, 255, 255, 0.65);  /* inner top highlight */
      --glass-hl-bot:    rgba(0, 0, 0, 0.04);        /* inner bottom shadow */
      --glass-blur:      28px;
      --glass-saturate:  200%;

      /* Text + interactive */
      --ink:             rgba(20, 20, 30, 0.95);
      --ink-soft:        rgba(20, 20, 30, 0.72);
      --hover-bg:        rgba(255, 255, 255, 0.35);
      --active-bg:       rgba(255, 255, 255, 0.55);

      /* Logo */
      --logo-bg:         rgba(15, 31, 61, 0.9);

      /* CTA */
      --cta-bg:          rgba(255, 255, 255, 0.55);
      --cta-bg-hover:    rgba(255, 255, 255, 0.7);
      --cta-border:      rgba(255, 255, 255, 0.6);
      --accent:          #28a868;

      /* Shadow stack — depth for the floating pill */
      --shadow-stack:
        inset 0 1px 1px rgba(255, 255, 255, 0.65),
        inset 0 -1px 1px rgba(0, 0, 0, 0.04),
        0 1px 2px rgba(0, 0, 0, 0.04),
        0 8px 24px rgba(0, 0, 0, 0.06),
        0 18px 48px rgba(0, 0, 0, 0.04);

      --radius-pill: 999px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;

      /* Demo backdrop so the glass effect is visible.
         On your real site, this becomes your page content. */
      min-height: 100vh;
      background:
        radial-gradient(60% 80% at 15% 20%, #FF8A65 0%, transparent 60%),
        radial-gradient(50% 70% at 85% 15%, #B57BFF 0%, transparent 55%),
        radial-gradient(70% 70% at 30% 90%, #4ECDC4 0%, transparent 60%),
        radial-gradient(60% 70% at 80% 85%, #5B9DF7 0%, transparent 55%),
        linear-gradient(180deg, #FFD8A8 0%, #FFE4B0 100%);
    }

    /* ─────────────────────────────────────────
       NAV WRAPPER (sticky float)
       ───────────────────────────────────────── */
    .glass-nav-wrap {
      position: sticky;
      top: 18px;
      z-index: 50;
      padding: 0 16px;
      display: flex;
      justify-content: center;
    }

    /* ─────────────────────────────────────────
       THE GLASS PILL
       ───────────────────────────────────────── */
    .glass-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 760px;
      padding: 9px 12px 9px 16px;
      border-radius: var(--radius-pill);

      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-stack);
    }

    /* ─── Logo ─── */
    .gn-logo {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--logo-bg);
      color: #fff;
      font-weight: 600; font-size: 13px;
      letter-spacing: -0.02em;
      text-decoration: none;
      transition: transform 0.18s ease;
    }
    .gn-logo:hover { transform: scale(1.06); }

    /* ─── Links ─── */
    .gn-links { display: flex; align-items: center; gap: 2px; }
    .gn-link {
      position: relative;
      padding: 7px 13px;
      font-size: 13.5px; font-weight: 500;
      color: var(--ink-soft);
      text-decoration: none;
      border-radius: var(--radius-pill);
      transition: background 0.2s ease, color 0.15s ease;
    }
    .gn-link:hover {
      color: var(--ink);
      background: var(--hover-bg);
    }
    .gn-link.active {
      color: var(--ink);
      background: var(--active-bg);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.6),
        0 1px 2px rgba(0,0,0,0.04);
    }

    /* ─── CTA (glass pill, lighter tint) ─── */
    .gn-cta {
      display: inline-flex;
      align-items: center; gap: 7px;
      padding: 7px 14px;
      font-family: inherit;
      font-size: 12.5px; font-weight: 600;
      color: var(--ink);
      background: var(--cta-bg);
      border: 1px solid var(--cta-border);
      box-shadow:
        inset 0 1px 0.5px rgba(255,255,255,0.7),
        0 1px 2px rgba(0,0,0,0.05);
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .gn-cta:hover {
      background: var(--cta-bg-hover);
      transform: translateY(-0.5px);
    }
    .gn-cta:active { transform: translateY(0); }
    .gn-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 2.5px rgba(40, 168, 104, 0.22);
    }

    /* ─────────────────────────────────────────
       MOBILE
       ───────────────────────────────────────── */
    @media (max-width: 600px) {
      .gn-links { display: none; }
      .glass-nav { padding: 8px 10px 8px 14px; }
      .gn-cta { padding: 6px 12px; }
    }

    /* ─────────────────────────────────────────
       OPTIONAL — DARK MODE TINT
       Auto-applies if visitor's OS is in dark mode.
       Glass material adapts; contents flip.
       ───────────────────────────────────────── */
    @media (prefers-color-scheme: dark) {
      :root {
        --glass-bg:     rgba(28, 28, 32, 0.45);
        --glass-border: rgba(255, 255, 255, 0.12);
        --glass-hl-top: rgba(255, 255, 255, 0.18);

        --ink:          rgba(255, 255, 255, 0.95);
        --ink-soft:     rgba(255, 255, 255, 0.65);
        --hover-bg:     rgba(255, 255, 255, 0.08);
        --active-bg:    rgba(255, 255, 255, 0.14);

        --logo-bg:      rgba(255, 255, 255, 0.95);

        --cta-bg:       rgba(255, 255, 255, 0.14);
        --cta-bg-hover: rgba(255, 255, 255, 0.22);
        --cta-border:   rgba(255, 255, 255, 0.18);
      }
      .gn-logo { color: #1a1a1a; }
    }

    /* Demo "page content" — remove on your real site */
    .demo {
      padding: 200px 24px;
      text-align: center;
      color: rgba(60, 30, 20, 0.55);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="glass-nav-wrap">
    <nav class="glass-nav" aria-label="Primary">
      <a href="#" class="gn-logo" aria-label="Home">D</a>

      <div class="gn-links">
        <a href="#work"   class="gn-link active">Work</a>
        <a href="#about"  class="gn-link">About</a>
        <a href="https://linkedin.com" class="gn-link" target="_blank" rel="noopener">LinkedIn</a>
        <a href="/resume.pdf" class="gn-link">Resume</a>
      </div>

      <button class="gn-cta" id="copy-btn" aria-label="Copy email address">
        <span class="gn-dot" aria-hidden="true"></span>
        <span id="copy-label">Copy email</span>
      </button>
    </nav>
  </div>

  <main class="demo">— scroll to see the glass float over your content —</main>

  <script>
    const btn = document.getElementById('copy-btn');
    const label = document.getElementById('copy-label');
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText('dineshballer@gmail.com');
        const original = label.textContent;
        label.textContent = 'Copied';
        setTimeout(() => (label.textContent = original), 1400);
      } catch (err) { console.error(err); }
    });
  </script>
</body>
</html>
