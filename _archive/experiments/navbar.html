<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dinesh — Portfolio</title>
  <style>
    /* ============================================
       DESIGN TOKENS — change these in one place
       ============================================ */
    :root {
      --nav-bg: rgba(255, 255, 255, 0.72);
      --nav-border: rgba(0, 0, 0, 0.06);
      --nav-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.04);

      --ink: #0F1F3D;        /* primary text + logo */
      --ink-soft: #475569;   /* nav links default */
      --ink-hover-bg: rgba(15, 31, 61, 0.04);

      --accent: #5DCAA5;     /* status dot */
      --cta-bg: #0F1F3D;
      --cta-bg-hover: #1A2F5A;
      --cta-fg: #FFFFFF;

      --radius-pill: 999px;
      --radius-sm: 8px;

      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      background: #FAFAF7;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================
       NAVBAR
       ============================================ */
    .nav-wrap {
      position: sticky;          /* stays visible on scroll */
      top: 16px;
      z-index: 50;
      padding: 0 20px;
    }

    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 14px 10px 18px;
      background: var(--nav-bg);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      backdrop-filter: saturate(180%) blur(14px);
      border: 0.5px solid var(--nav-border);
      border-radius: var(--radius-pill);
      box-shadow: var(--nav-shadow);
    }

    /* Logo */
    .nav-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: -0.02em;
      text-decoration: none;
      transition: transform 0.18s ease;
    }
    .nav-logo:hover { transform: scale(1.05); }

    /* Links */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .nav-link {
      position: relative;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-soft);
      text-decoration: none;
      border-radius: var(--radius-sm);
      transition: color 0.15s ease, background 0.15s ease;
    }
    .nav-link:hover {
      color: var(--ink);
      background: var(--ink-hover-bg);
    }
    .nav-link.active { color: var(--ink); }
    .nav-link.active::after {
      content: '';
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 2px;
      height: 1.5px;
      background: var(--ink);
      border-radius: 2px;
    }

    /* CTA button */
    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      background: var(--cta-bg);
      color: var(--cta-fg);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      border: none;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .nav-cta:hover {
      background: var(--cta-bg-hover);
      transform: translateY(-1px);
    }
    .nav-cta:active { transform: translateY(0); }
    .nav-cta .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(93, 202, 165, 0.25);
    }

    /* ============================================
       MOBILE
       ============================================ */
    @media (max-width: 640px) {
      .nav-links { display: none; }      /* swap to a sheet/drawer in production */
      .nav-bar { padding: 8px 10px 8px 14px; }
      .nav-cta { padding: 8px 12px; }
    }

    /* Demo page content */
    .demo {
      padding: 120px 20px;
      text-align: center;
      color: #94A3B8;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="nav-wrap">
    <nav class="nav-bar" aria-label="Primary">
      <a href="#" class="nav-logo" aria-label="Home">D</a>

      <div class="nav-links">
        <a href="#work" class="nav-link active">Work</a>
        <a href="#about" class="nav-link">About</a>
        <a href="https://linkedin.com" class="nav-link" target="_blank" rel="noopener">LinkedIn</a>
        <a href="/resume.pdf" class="nav-link">Resume</a>
      </div>

      <button class="nav-cta" id="copy-btn" aria-label="Copy email address">
        <span class="dot" aria-hidden="true"></span>
        <span id="copy-label">Copy email</span>
      </button>
    </nav>
  </div>

  <main class="demo">— your page content —</main>

  <script>
    const btn = document.getElementById('copy-btn');
    const label = document.getElementById('copy-label');
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText('dineshballer@gmail.com');
        const original = label.textContent;
        label.textContent = 'Copied';
        setTimeout(() => (label.textContent = original), 1400);
      } catch (err) { console.error(err); }
    });
  </script>
</body>
</html>
