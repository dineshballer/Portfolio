<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
body{margin:0;background:#F6F1E8;font-family:Georgia,serif;display:flex;flex-wrap:wrap;gap:30px;padding:44px;align-items:flex-start}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6f6a60;font-family:system-ui}
.hdr{display:flex;align-items:center;gap:9px;background:#FFFDF9;border:1px solid #e4ddcf;border-radius:12px;padding:11px 15px}
.nm{font-size:19px;color:#171717}
.av{width:30px;height:30px;border-radius:9px;background:radial-gradient(circle at 50% 38%,#fbf6ec,#f3ece0 72%,#ece3d4);border:1px solid rgba(31,77,62,.18);display:flex;align-items:center;justify-content:center;overflow:hidden}
.big{width:120px;height:120px;border-radius:18px;background:radial-gradient(circle at 50% 36%,#fbf6ec,#f3ece0 72%,#ece3d4);border:1px solid rgba(31,77,62,.16);display:flex;align-items:center;justify-content:center}
</style></head><body>

<div class="cell"><span class="lbl">Small: enso + spark only (24px)</span>
<div class="hdr">
<span class="av"><svg width="22" height="22" viewBox="0 0 100 100">
  <path d="M73 25 A33 33 0 1 0 82 55" fill="none" stroke="#1F4D3E" stroke-width="8" stroke-linecap="round"/>
  <path d="M80 13 L82.6 21.4 L91 24 L82.6 26.6 L80 35 L77.4 26.6 L69 24 L77.4 21.4 Z" fill="#c8772e"/>
</svg></span><span class="nm">Sage</span></div></div>

<div class="cell"><span class="lbl">Small: enso + center dot</span>
<div class="hdr">
<span class="av"><svg width="22" height="22" viewBox="0 0 100 100">
  <path d="M73 25 A33 33 0 1 0 82 55" fill="none" stroke="#1F4D3E" stroke-width="8" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="7" fill="#1F4D3E"/>
  <path d="M80 13 L82.6 21.4 L91 24 L82.6 26.6 L80 35 L77.4 26.6 L69 24 L77.4 21.4 Z" fill="#c8772e"/>
</svg></span><span class="nm">Sage</span></div></div>

<div class="cell"><span class="lbl">Small: lotus dot (zen)</span>
<div class="hdr">
<span class="av"><svg width="22" height="22" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="34" fill="none" stroke="#1F4D3E" stroke-width="7"/>
  <circle cx="50" cy="50" r="9" fill="#c8772e"/>
</svg></span><span class="nm">Sage</span></div></div>

<div class="cell"><span class="lbl">Large profile: refined figure-in-enso</span>
<div class="big"><svg width="84" height="84" viewBox="0 0 100 100">
  <path d="M72 24 A34 34 0 1 0 82 54" fill="none" stroke="#1F4D3E" stroke-width="5" stroke-linecap="round"/>
  <path d="M80 12 L82.6 20.8 L91.5 23.4 L82.6 26 L80 34.8 L77.4 26 L68.5 23.4 L77.4 20.8 Z" fill="#c8772e"/>
  <circle cx="50" cy="38" r="6" fill="#1F4D3E"/>
  <g fill="none" stroke="#1F4D3E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 45 C 44 49, 41 57, 43 63"/>
    <path d="M50 45 C 56 49, 59 57, 57 63"/>
    <path d="M40 65 Q 50 60, 60 65"/>
  </g>
</svg></div></div>

<div class="cell"><span class="lbl">Dark + favicons (enso+spark)</span>
<div class="big" style="background:#1F4D3E;gap:14px">
<svg width="44" height="44" viewBox="0 0 100 100"><path d="M73 25 A33 33 0 1 0 82 55" fill="none" stroke="#cfeede" stroke-width="8" stroke-linecap="round"/><path d="M80 13 L82.6 21.4 L91 24 L82.6 26.6 L80 35 L77.4 26.6 L69 24 L77.4 21.4 Z" fill="#e0a657"/></svg>
<svg width="20" height="20" viewBox="0 0 100 100"><path d="M73 25 A33 33 0 1 0 82 55" fill="none" stroke="#cfeede" stroke-width="10" stroke-linecap="round"/><path d="M80 13 L82.6 21.4 L91 24 L82.6 26.6 L80 35 L77.4 26.6 L69 24 L77.4 21.4 Z" fill="#e0a657"/></svg>
</div></div>

</body></html>
