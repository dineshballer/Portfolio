<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
body{margin:0;background:#F6F1E8;font-family:system-ui;display:flex;flex-wrap:wrap;gap:36px;padding:48px;align-items:flex-start}
.cell{display:flex;flex-direction:column;align-items:center;gap:12px}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6f6a60}
.box{background:#FFFDF9;border:1px solid #e4ddcf;border-radius:16px;padding:24px;display:flex;align-items:center;justify-content:center}
.dark{background:#1F4D3E;border:none}
.row{display:flex;gap:16px;align-items:center}
.hdr{display:flex;align-items:center;gap:9px;background:#FFFDF9;border:1px solid #e4ddcf;border-radius:12px;padding:12px 16px}
.hdr .nm{font-family:Georgia,serif;font-size:19px;color:#171717}
.av{width:30px;height:30px;border-radius:9px;background:radial-gradient(circle at 50% 38%,#fff6e2,#f3e7cf 70%,#ecdcbf);border:1px solid rgba(31,77,62,.28);display:flex;align-items:center;justify-content:center;overflow:hidden}
</style></head><body>

<div class="cell"><span class="lbl">D refined — figure in enso (hero avatar)</span>
<div class="box">
<svg width="120" height="120" viewBox="0 0 100 100">
  <!-- enso ring, open at top-right -->
  <path d="M70 23 A33 33 0 1 0 81 52" fill="none" stroke="#1F4D3E" stroke-width="5.5" stroke-linecap="round"/>
  <!-- spark sitting in the ring's opening -->
  <path d="M78 14 L80 21 L87 23 L80 25 L78 32 L76 25 L69 23 L76 21 Z" fill="#c8772e"/>
  <!-- meditating figure, centered -->
  <g fill="none" stroke="#2f7d57" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="40" r="6.5"/>
    <path d="M50 47 C 43 51, 40 59, 42 66"/>
    <path d="M50 47 C 57 51, 60 59, 58 66"/>
    <path d="M38 68 C 45 61, 55 61, 62 68"/>
  </g>
</svg>
</div></div>

<div class="cell"><span class="lbl">D filled head variant</span>
<div class="box">
<svg width="120" height="120" viewBox="0 0 100 100">
  <path d="M70 23 A33 33 0 1 0 81 52" fill="none" stroke="#1F4D3E" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M78 14 L80 21 L87 23 L80 25 L78 32 L76 25 L69 23 L76 21 Z" fill="#c8772e"/>
  <circle cx="50" cy="39" r="6.5" fill="#2f7d57"/>
  <g fill="none" stroke="#2f7d57" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 46 C 43 50, 40 59, 42 66"/>
    <path d="M50 46 C 57 50, 60 59, 58 66"/>
    <path d="M38 68 C 45 61, 55 61, 62 68"/>
  </g>
</svg>
</div></div>

<div class="cell"><span class="lbl">A refined — enso+spark (favicon mark)</span>
<div class="box">
<svg width="120" height="120" viewBox="0 0 100 100">
  <path d="M71 24 A33 33 0 1 0 80 53" fill="none" stroke="#1F4D3E" stroke-width="7" stroke-linecap="round"/>
  <path d="M78 12 L80.5 20.5 L89 23 L80.5 25.5 L78 34 L75.5 25.5 L67 23 L75.5 20.5 Z" fill="#c8772e"/>
</svg>
</div></div>

<div class="cell"><span class="lbl">In header (D, 30px) + favicons (A)</span>
<div class="box" style="flex-direction:column;gap:16px;align-items:flex-start">
  <div class="hdr">
    <span class="av">
      <svg width="24" height="24" viewBox="0 0 100 100">
        <path d="M70 23 A33 33 0 1 0 81 52" fill="none" stroke="#1F4D3E" stroke-width="6" stroke-linecap="round"/>
        <path d="M78 14 L80 21 L87 23 L80 25 L78 32 L76 25 L69 23 L76 21 Z" fill="#c8772e"/>
        <circle cx="50" cy="39" r="6.5" fill="#2f7d57"/>
        <g fill="none" stroke="#2f7d57" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M50 46 C 43 50, 40 59, 42 66"/><path d="M50 46 C 57 50, 60 59, 58 66"/><path d="M38 68 C 45 61, 55 61, 62 68"/>
        </g>
      </svg>
    </span>
    <span class="nm">Sage</span>
  </div>
  <div class="row">
    <span class="av" style="width:16px;height:16px;border-radius:5px"><svg width="13" height="13" viewBox="0 0 100 100"><path d="M71 24 A33 33 0 1 0 80 53" fill="none" stroke="#1F4D3E" stroke-width="9" stroke-linecap="round"/><path d="M78 12 L80.5 20.5 L89 23 L80.5 25.5 L78 34 L75.5 25.5 L67 23 L75.5 20.5 Z" fill="#c8772e"/></svg></span>
    <span class="av dark" style="width:32px;height:32px"><svg width="24" height="24" viewBox="0 0 100 100"><path d="M71 24 A33 33 0 1 0 80 53" fill="none" stroke="#cfeede" stroke-width="7" stroke-linecap="round"/><path d="M78 12 L80.5 20.5 L89 23 L80.5 25.5 L78 34 L75.5 25.5 L67 23 L75.5 20.5 Z" fill="#e0a657"/></svg></span>
  </div>
</div></div>

</body></html>
